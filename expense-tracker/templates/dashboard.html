{% extends "base.html" %}

{% block title %}Dashboard — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Welcome, {{ user_name }}!</h1>
            <p class="auth-subtitle">Your expense dashboard — coming in Step 5</p>
        </div>
        <div class="auth-card">
            <p style="text-align:center; color: var(--text-muted); margin-bottom: 1.5rem;">
                You are successfully logged in to Spendly.
            </p>
            <a href="{{ url_for('logout') }}" class="btn-submit" style="display:block; text-align:center; text-decoration:none;">
                Sign out
            </a>
        </div>
    </div>
</section>

{% endblock %}
